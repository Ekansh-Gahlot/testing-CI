name: Enforce Test Updates

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main, staging]

permissions:
  pull-requests: write
  contents: read

jobs:
  test-policy:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'bypass-ci') }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install

      - name: Get PR labels
        run: |
          echo "PR_LABELS=${{ join(github.event.pull_request.labels.*.name, ',') }}" >> $GITHUB_ENV

      - name: Run test update check
        env:
          TEST_EXCLUDE_PATHS: "scripts,src/config" # Comma-separated paths to skip test enforcement (e.g. "scripts,src/config,src/types")
        run: yarn check-tests

  ai-review:
    runs-on: ubuntu-latest
    needs: test-policy
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'bypass-ci') && !contains(github.event.pull_request.labels.*.name, 'bypass-review') }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install

      - name: AI Code Review
        env:
          # Provider config: set AI_PROVIDER to "openai", "anthropic", or "google"
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'openai' }}
          AI_MODEL: ${{ vars.AI_MODEL || '' }} # Leave empty for provider default
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          # Fallback: provider-specific keys (used if AI_API_KEY is not set)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_GUIDELINES_PATH: ".github/AI_REVIEW_GUIDELINES.md" # Path to custom review guidelines
          REVIEW_ROOTS: "src" # Comma-separated dirs to review (e.g. "src,lib")
          EXCLUDE_PATHS: "src/tests" # Comma-separated dirs/paths to skip (e.g. "src/generated,src/mocks")
        run: yarn ai-review
