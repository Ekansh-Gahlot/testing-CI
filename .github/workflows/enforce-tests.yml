name: Enforce Test Updates

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [ main, staging ]

permissions:
  pull-requests: write
  contents: read

jobs:
  test-policy:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'bypass-ci') }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: yarn install

      - name: Get PR labels
        run: |
          echo "PR_LABELS=${{ join(github.event.pull_request.labels.*.name, ',') }}" >> $GITHUB_ENV

      - name: Run test update check
        run: yarn check-tests

  ai-review:
    runs-on: ubuntu-latest
    needs: test-policy
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'bypass-ci') && !contains(github.event.pull_request.labels.*.name, 'bypass-review') }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: yarn install

      - name: AI Code Review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_ROOTS: "src"          # Comma-separated dirs to review (e.g. "src,lib")
          EXCLUDE_PATHS: ""            # Comma-separated dirs/paths to skip (e.g. "src/generated,src/mocks")
        run: yarn ai-review
